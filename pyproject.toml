[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "witness-foundation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
where = ["apps/api", "packages/contracts"]
include = ["witness_api*", "witness_contracts*"]
[tool.pytest.ini_options]
pythonpath = ["apps/api", "packages/contracts"]
testpaths = ["apps/api/tests"]
