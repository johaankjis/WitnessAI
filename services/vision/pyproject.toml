[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "witness-vision"
version = "0.1.0"
description = "Witness vision engine: frame sampling, vehicle detection/tracking, detector observations"
requires-python = ">=3.11"
# Contracts (witness_contracts) come from the root `witness-foundation` package; install both:
#   python -m pip install -e . -e 'services/vision[dev]'
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.9", "numpy>=1.26"]
yolo = ["ultralytics>=8.3", "opencv-python-headless>=4.9", "numpy>=1.26"]
weave = ["weave>=0.51"]
dev = ["pytest>=8,<10", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["witness_vision*"]

[tool.pytest.ini_options]
pythonpath = [".", "../../packages/contracts", "../../apps/api"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip(x, x[1:]) pairs are intentionally unequal
